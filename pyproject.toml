[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "feature-blueprint"
version = "0.1.0"
description = "Generate evidence-backed full-stack requirements from a web application feature"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["requirements", "browser-automation", "playwright", "gemini", "code-generation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Documentation",
]
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "google-genai>=1.30,<2",
  "httpx>=0.27,<1",
  "playwright>=1.50,<2",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
]

[project.scripts]
feature-blueprint = "requirements_fetcher.cli:main"
requirements-fetcher = "requirements_fetcher.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "browser: requires an installed Playwright Chromium browser",
  "live: requires external network access and a real Gemini API key",
]

[tool.setuptools.packages.find]
include = ["requirements_fetcher*"]
